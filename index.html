<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD Fleury 🙂</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="welcome-screen">
        <h1>Joyeux Anniversaire !</h1>
        <p>Clique sur le bouton pour commencer l'aventure...</p>
        <button id="start-btn">Découvrir ma surprise ✨</button>
    </div>

    <div id="canvas-container"></div>

    <div id="modal" class="hidden">
        <div class="modal-content">
            <span id="close-btn">&times;</span>
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Éléments audio -->
    <audio id="bg-music" src="chanson1.mp3" loop></audio>
    <audio id="poem-music" src="chanson_poeme.mp3"></audio>
    <audio id="joke-music" src="chansons_blague.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
